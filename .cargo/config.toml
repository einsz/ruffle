[target.'cfg(all())']
# NOTE that the web build overrides this setting in tools/build_wasm.ts via the RUSTFLAGS environment variable
rustflags = [
    # We need to specify this flag for all targets because Clippy checks all of our code against all targets
    # and our web code does not compile without this flag
    "--cfg=web_sys_unstable_apis",
]

[target.x86_64-pc-windows-msvc]
# Use the LLD linker, it should be faster than the default.
# See: https://github.com/rust-lang/rust/issues/71520
linker = "rust-lld.exe"

[env]
# Set the minimum stack size for tests to 8 MiB.
# Otherwise some tests overflow the stack.
RUST_MIN_STACK = "8388608"
LOCAL_RUFFLE_TESTS_SWFS_DIR = { value = "tests/tests/swfs", relative = true }
LOCAL_RUFFLE_FUZZ_WORKSPACE_DIR = { value = "fuzz", relative = true }
FLASH_PLAYERS_TEST_CONFIG = { value = ".flash_players.toml", relative = true }

[alias]
testutils = "run --package tests --"
fuzzer = "run --package ruffle_fuzzer --"

# z0r fork only (see einsz/ruffle branch z0r-deps): dependency fixes that are
# not released upstream. Cargo merges these with any [patch] in Cargo.toml.

# Substitute zero for an invalid Huffman code and go on, like libjpeg and
# Flash, instead of failing to decode the whole JPEG.
[patch.crates-io]
jpeg-decoder = { git = "https://github.com/einsz/jpeg-decoder", rev = "c7f37aeda1b8aa6b0fc6422fc35fde7151d8b873" }

# End a picture with its last macroblock (Sorenson streams padded with a
# zero byte), and decode disposable P-frames, ruffle-rs/h263-rs. Branch z0r
# of einsz/h263-rs has both.
[patch."https://github.com/ruffle-rs/h263-rs"]
h263-rs = { git = "https://github.com/einsz/h263-rs", rev = "f16b86e5e9a414a5bed99ade9ddafc8427ac9406" }
h263-rs-deblock = { git = "https://github.com/einsz/h263-rs", rev = "f16b86e5e9a414a5bed99ade9ddafc8427ac9406" }
